<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Compact Store List</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #121212; color: #e0e0e0; padding: 8px; max-width: 480px; margin: 0 auto; font-size: 13px; }
    
    /* Header Controls */
    .bar { display: flex; gap: 6px; margin-bottom: 8px; }
    select, input, button { font-size: 13px; padding: 6px 8px; border-radius: 6px; border: 1px solid #333; background: #1e1e1e; color: #fff; outline: none; }
    select { flex: 1; font-weight: bold; background: #2a2a2a; }
    .btn { background: #2c6bed; color: white; border: none; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .btn-danger { background: #cf6679; color: #000; }
    
    /* Add Form */
    .add-form { display: flex; gap: 4px; background: #1e1e1e; padding: 6px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #2a2a2a; }
    .add-form input[name="bin"] { width: 65px; text-transform: uppercase; text-align: center; }
    .add-form input[name="item"] { flex: 1; }
    
    /* List Layout */
    .list { display: flex; flex-direction: column; gap: 4px; }
    .row { display: flex; align-items: center; gap: 6px; background: #1e1e1e; padding: 6px 8px; border-radius: 6px; border-left: 3px solid #00e676; }
    .row.unneeded { border-left-color: #444; opacity: 0.45; }
    
    /* Data Fields */
    .bin { font-family: monospace; font-weight: bold; font-size: 11px; background: #2a2a2a; color: #ffb74d; padding: 2px 5px; border-radius: 4px; min-width: 42px; text-align: center; flex-shrink: 0; }
    .item-name { flex: 1; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    
    /* Toggle Switch */
    .toggle { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; border: none; cursor: pointer; min-width: 55px; text-align: center; flex-shrink: 0; }
    .toggle.need { background: #00e676; color: #000; }
    .toggle.done { background: #333; color: #888; }
    
    .actions { display: flex; gap: 2px; flex-shrink: 0; }
    .icon-btn { background: none; border: none; color: #888; padding: 2px 4px; font-size: 12px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="bar">
    <select id="storeSelect" onchange="switchStore()"></select>
    <button class="btn" onclick="addStore()">+ Store</button>
  </div>

  <form class="add-form" onsubmit="addItem(event)">
    <input type="text" id="newBin" name="bin" placeholder="Bin/Aisle" autocomplete="off">
    <input type="text" id="newItem" name="item" placeholder="New Item Name..." required autocomplete="off">
    <button type="submit" class="btn">Add</button>
  </form>

  <div id="itemList" class="list"></div>

  <script>
    // System Data Architecture
    let db = JSON.parse(localStorage.getItem('shopping_db')) || {
      activeStore: "Walmart",
      stores: {
        "Walmart": [
          { id: 1, bin: "A12", name: "Cereal", needed: true },
          { id: 2, bin: "B4", name: "Milk", needed: true },
          { id: 3, bin: "A1", name: "Bananas", needed: false }
        ],
        "Menards": [
          { id: 4, bin: "14B", name: "Screws 1-1/2in", needed: true }
        ]
      }
    };

    function save() {
      localStorage.setItem('shopping_db', JSON.stringify(db));
    }

    function init() {
      const select = document.getElementById('storeSelect');
      select.innerHTML = '';
      Object.keys(db.stores).forEach(store => {
        const opt = document.createElement('option');
        opt.value = store;
        opt.textContent = store;
        if (store === db.activeStore) opt.selected = true;
        select.appendChild(opt);
      });
      renderList();
    }

    function switchStore() {
      db.activeStore = document.getElementById('storeSelect').value;
      save();
      renderList();
    }

    function addStore() {
      const name = prompt("Enter new store name:");
      if (name && !db.stores[name]) {
        db.stores[name] = [];
        db.activeStore = name;
        save();
        init();
      }
    }

    function addItem(e) {
      e.preventDefault();
      const binInput = document.getElementById('newBin');
      const itemInput = document.getElementById('newItem');
      
      const newItem = {
        id: Date.now(),
        bin: binInput.value.trim().toUpperCase() || "--",
        name: itemInput.value.trim(),
        needed: true
      };

      db.stores[db.activeStore].push(newItem);
      save();
      
      // Preserve Bin for fast batch entry, clear item text, prevent scroll jump
      itemInput.value = '';
      itemInput.focus();
      renderList();
    }

    function toggleNeed(id) {
      const items = db.stores[db.activeStore];
      const target = items.find(i => i.id === id);
      if (target) {
        target.needed = !target.needed;
        save();
        renderList();
      }
    }

    function editItem(id) {
      const items = db.stores[db.activeStore];
      const target = items.find(i => i.id === id);
      if (!target) return;

      const newBin = prompt("Edit Bin/Location:", target.bin);
      if (newBin === null) return;
      const newName = prompt("Edit Item Name:", target.name);
      if (newName === null) return;

      target.bin = newBin.trim().toUpperCase() || "--";
      target.name = newName.trim();
      save();
      renderList();
    }

    function deleteItem(id) {
      const items = db.stores[db.activeStore] || [];
      const target = items.find(i => i.id === id);
      const name = target ? target.name : 'this item';

      if (confirm(`Delete "${name}" permanently?`)) {
        db.stores[db.activeStore] = items.filter(i => i.id !== id);
        save();
        renderList();
      }
    }

    function renderList() {
      const container = document.getElementById('itemList');
      const items = db.stores[db.activeStore] || [];

      // Sort Order: Needed (Yes -> No) | Bin Ascending | Item Ascending
      items.sort((a, b) => {
        if (a.needed !== b.needed) return a.needed ? -1 : 1;
        const binCmp = a.bin.localeCompare(b.bin, undefined, { numeric: true, sensitivity: 'base' });
        if (binCmp !== 0) return binCmp;
        return a.name.localeCompare(b.name, undefined, { sensitivity: 'base' });
      });

      container.innerHTML = items.map(item => `
        <div class="row ${item.needed ? '' : 'unneeded'}">
          <span class="bin">${item.bin}</span>
          <span class="item-name">${item.name}</span>
          <button class="toggle ${item.needed ? 'need' : 'done'}" onclick="toggleNeed(${item.id})">
            ${item.needed ? 'NEED' : 'OFF'}
          </button>
          <div class="actions">
            <button class="icon-btn" onclick="editItem(${item.id})">✏️</button>
            <button class="icon-btn" onclick="deleteItem(${item.id})">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    // Force purge old Service Workers and clear cache storage to fix domain collisions
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
      if ('caches' in window) {
        caches.keys().then(names => {
          for (let name of names) caches.delete(name);
        });
      }
    }

    init();
  </script>
</body>
</html>
